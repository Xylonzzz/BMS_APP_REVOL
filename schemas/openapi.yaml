openapi: 3.1.0
info:
  title: BMS APP REVOL API
  version: 0.4.0
  description: 只读 BMS 模拟、文件与 CAN 数据 API。主机接收时间和序号不代表固件采样批次，真实报文缺少有效性证据时标记 unknown。
servers:
  - url: http://127.0.0.1:8765
paths:
  /api/v1/ai/providers:
    get:
      responses:
        '200':
          description: 可用只读分析服务 items，含 id/model/external，不返回凭据。
  /api/v1/ai/analyze:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: {type: string, default: local-rules}
                snapshotId: {type: string}
                allowRemote: {type: boolean, default: false}
      responses:
        '200':
          description: 最新快照只读分析，含 snapshotId/generatedAt/ruleVersion/externalRequest/limitations；不执行控制。
          content:
            application/json:
              schema: {$ref: './ai-analysis.json'}
        '400': {description: 无效请求或未配置的服务}
        '403': {description: 未明确允许向配置的外部模型发送质量摘要}
        '404': {description: 当前会话没有快照}
        '409': {description: 快照已变化，需要重新加载后分析}
        '413': {description: 请求超过8 KiB}
        '502': {description: 模型服务失败}
  /api/v1/catalog:
    get:
      responses:
        '200':
          description: items 按信号名称索引，含 label/path/unit/divisor。signals 原值除以 divisor 得工程量，packStatus 已是工程量。
  /api/v1/sessions:
    get:
      responses:
        '200':
          description: 会话 items，每项 id/name/source/first/last；客户端只使用返回的 id，不传文件路径。
  /api/v1/sessions/{id}/snapshots:
    get:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: 分页记录；nextOffset 为 null 表示当前已到末尾，实时会话之后仍可能追加。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextOffset]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BmsSnapshot'}}
                  nextOffset: {type: [integer, 'null']}
        '400': {description: 无效会话或分页参数}
        '404': {description: 会话不存在}
  /api/v1/sessions/{id}/export:
    get:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: kind, schema: {type: string, enum: [summary, full, snapshot], default: summary}}
      responses:
        '200':
          description: summary 为含质量的工程量 CSV，full 为原始 JSONL 与 SHA256 manifest 的 ZIP，snapshot 为最新快照 JSON。原记录不改写。
        '400': {description: 无效会话或导出类型}
        '404': {description: 会话不存在或没有快照}
  /api/v1/capture:
    get:
      responses:
        '200':
          description: 接收线程状态；文件 completed 表示读取结束，不能作为实时在线状态。
          content:
            application/json:
              schema:
                type: object
                required: [state, dataSource, receivedFrames, error]
                properties:
                  state: {enum: [idle, running, completed, stopped, error]}
                  dataSource: {enum: [simulation, can, file]}
                  receivedFrames: {type: integer, minimum: 0}
                  error: {type: [string, 'null']}
  /api/v1/health:
    get:
      responses:
        '200':
          description: 服务状态
  /api/v1/snapshots/latest:
    get:
      responses:
        '200':
          description: 最新 BMS 快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BmsSnapshot'
  /api/v1/snapshots:
    get:
      parameters:
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: 当前会话分页快照，items 与 nextOffset。
  /api/v1/diagnostics:
    get:
      responses:
        '200':
          description: 最新快照的诊断事件列表及 snapshotId；历史诊断从会话分页读取。
  /api/v1/schema:
    get:
      responses:
        '200':
          description: 信号树 JSON Schema
  /api/v1/replay/scenarios:
    get:
      responses:
        '200':
          description: 可用回放场景
  /api/v1/replay/scenarios/{name}:
    get:
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 回放场景记录
          content:
            application/json:
              schema:
                $ref: './replay-response.json'
        '404':
          description: 未知回放场景
components:
  schemas:
    QualityStatus:
      type: string
      enum: [valid, pec_error, timeout, partial, stale, range_error, disconnected, unknown]
    ModelDetection:
      type: object
      required: [model, mode, confidence, reason, observed, ruleVersion, timestamp]
      properties:
        model: {type: string, enum: [af, ef, unknown]}
        mode: {type: string, enum: [automatic, manual]}
        confidence: {type: string, enum: [high, medium, low]}
        reason: {type: string}
        observed: {type: array, items: {type: string}}
        ruleVersion: {type: string}
        timestamp: {type: number}
    BmsSnapshot:
      $ref: './signal-tree.json'
